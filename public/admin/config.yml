backend:
  name: github
  repo: zhao6822/portfolio
  branch: main
  base_url: https://zhaopeng-portfolio.pages.dev
  auth_endpoint: /api/auth
  api_root: https://zhaopeng-portfolio.pages.dev/api/gh
  graphql_api_root: https://zhaopeng-portfolio.pages.dev/api/gh/graphql
  commit_messages:
    create: '新增成果：{{fields.title}}'
    update: '更新成果：{{fields.title}}'
    delete: '删除成果：{{fields.title}}'
    uploadMedia: '上传图片：{{path}}'
    deleteMedia: '删除图片：{{path}}'

media_folder: public/images
public_folder: /images

collections:
  - name: projects
    label: 项目成果
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 一句话成果
        name: summary
        widget: text
        hint: 一句话说清这个项目做成了什么，会显示在列表卡片上
      - label: 日期
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: 用于排序和按年份分组，一般填项目结束的月份
      - label: 起止时间
        name: period
        widget: string
        hint: 例：2026.03 – 2026.06
      - label: 我的角色
        name: role
        widget: string
        hint: 例：项目负责人 / 独立执行 / 设计支持
      - label: 状态
        name: status
        widget: select
        options:
          - 进行中
          - 已交付
          - 已归档
        default: 已交付
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 例：产品、品牌、数据。用于分类筛选
        field:
          label: 标签
          name: tag
          widget: string
      - label: 成果数据
        name: metrics
        widget: list
        required: false
        hint: 尽量填具体数字，这是作品集里最有说服力的部分
        field:
          label: 一条数据
          name: metric
          widget: object
          fields:
            - label: 名称
              name: label
              widget: string
              hint: 例：转化率
            - label: 数值
              name: value
              widget: string
              hint: 例：+18%
      - label: 相关链接
        name: links
        widget: list
        required: false
        field:
          label: 一个链接
          name: link
          widget: object
          fields:
            - label: 名称
              name: name
              widget: string
            - label: 地址
              name: url
              widget: string
      - label: 封面图
        name: cover
        widget: image
        required: false
        hint: 建议 16:9 横图。手机/微信原图也能直接传，网站会自动压缩；传完要等 1–3 分钟网站重新生成后才会显示出来
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 勾上则不会显示在网站上，方便先写一半存着
      - label: 正文
        name: body
        widget: markdown
        hint: 建议按「背景 / 我做了什么 / 结果与复盘」三段写

  - name: settings
    label: 站点信息
    files:
      - name: site
        label: 基本信息
        file: src/site.json
        format: json
        fields:
          - label: 网站名
            name: name
            widget: string
            hint: 显示在浏览器标签页和页面左上角
          - label: 副标题
            name: title
            widget: string
          - label: 搜索结果简介
            name: description
            widget: text
            hint: 别人搜到你名字时，搜索引擎显示的那一小段话
          - label: 你的名字
            name: author
            widget: string
          - label: 一句话定位
            name: intro
            widget: text
            hint: 首屏最显眼的那句话。建议写「方向 + 擅长」，例：微短剧后期，从剪辑到调色能独立跑完一条片
          - label: 能力关键词
            name: keywords
            widget: list
            required: false
            hint: 显示在名字下面的一排小标签，例：微短剧后期
            field:
              label: 一个关键词
              name: keyword
              widget: string
          - label: 头像 / 职业照
            name: avatar
            widget: image
            required: false
            hint: 上传后地址会自动填好，留空则不显示。建议正方形
          - label: 简历 PDF
            name: resumeUrl
            widget: file
            required: false
            hint: 上传 PDF 后，首页底部会出现「下载简历 PDF」按钮
          - label: 关于页正文
            name: about
            widget: list
            required: false
            hint: 一段一条，写你的经历和做事方式
            field:
              label: 一段话
              name: paragraph
              widget: text
          - label: 联系邮箱
            name: email
            widget: string
          - label: 外部链接
            name: links
            widget: list
            required: false
            hint: 显示在页脚，例：B站主页、样片网盘
            field:
              label: 一个链接
              name: link
              widget: object
              fields:
                - label: 名称
                  name: name
                  widget: string
                - label: 地址
                  name: url
                  widget: string
          - label: 访问统计编号
            name: analyticsToken
            widget: string
            required: false
            hint: 用来统计有多少人看过你的作品集，一般不用动
