<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内容后台</title>
    <style>
      body {
        margin: 0;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }
      .admin-fallback {
        padding: 32px;
        max-width: 560px;
        margin: 48px auto;
        line-height: 1.8;
        color: #3f3f46;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        background: #fff;
        position: relative;
        z-index: 9999;
      }
      .admin-fallback h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .admin-fallback pre {
        background: #f4f4f5;
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 220px;
        overflow: auto;
      }
      .admin-fallback button {
        margin: 12px 8px 0 0;
        padding: 10px 18px;
        font-size: 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .admin-fallback button.gray {
        background: #52525b;
      }
    </style>
  </head>
  <body>
    <script>
      // 提前告知 Sveltia：我们手动初始化（ES module 里 document.currentScript 为 null，自动初始化不会触发）
      window.CMS_MANUAL_INIT = true;
      window.__adminDiag = { errors: [] };
      window.addEventListener('error', function (e) {
        window.__adminDiag.errors.push(String(e.message || e.type));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__adminDiag.errors.push('promise: ' + String(e.reason && e.reason.message ? e.reason.message : e.reason));
      });

      // 注册 Service Worker：把 unpkg / jsdelivr / api.github.com 的请求改走本地或本站代理
      try {
        navigator.serviceWorker.register('./sw.js');
        // 新版小程序接管页面时自动刷新一次，确保所有请求都走最新规则
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          try {
            if (!sessionStorage.getItem('admin-sw-reloaded')) {
              sessionStorage.setItem('admin-sw-reloaded', '1');
              location.reload();
            }
          } catch (e) {}
        });
      } catch (e) {
        window.__adminDiag.errors.push('sw-register: ' + String(e));
      }
    </script>
    <script type="module">
      (async () => {
        var diag = window.__adminDiag;
        // 最多等 3 秒：无论 Service Worker 是否就绪，后台都要启动
        try {
          await Promise.race([
            navigator.serviceWorker.ready,
            new Promise(function (r) {
              setTimeout(r, 3000);
            }),
          ]);
        } catch (e) {
          diag.errors.push('sw-ready: ' + String(e));
        }
        try {
          var CMS = (await import('./sveltia-cms.mjs')).default;
          diag.moduleLoaded = true;
          CMS.init();
        } catch (e) {
          diag.errors.push('init: ' + String(e && e.message ? e.message : e));
        }
      })();
    </script>
    <script>
      (function () {
        // ---------- 通用工具 ----------
        function buildDiagText(extra) {
          var diag = window.__adminDiag || {};
          var lines = [];
          lines.push('页面地址: ' + location.href);
          lines.push('网络在线: ' + navigator.onLine);
          lines.push('浏览器: ' + navigator.userAgent.slice(0, 90));
          lines.push('小程序支持: ' + ('serviceWorker' in navigator));
          return navigator.serviceWorker && navigator.serviceWorker.getRegistrations
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                var reg = null;
                for (var i = 0; i < regs.length; i++) {
                  if (regs[i].active) reg = regs[i];
                }
                lines.push('小程序状态: ' + (reg ? reg.active.state : '无'));
                return fetch('./sveltia-cms.mjs', { headers: { range: 'bytes=0-99' } });
              }).then(function (resp) {
                lines.push('主脚本可达: HTTP ' + resp.status);
              }, function (e) {
                lines.push('主脚本可达: 失败 ' + e);
              }).then(function () {
                lines.push('主脚本已执行: ' + (diag.moduleLoaded === true ? '是' : diag.moduleLoaded === undefined ? '未完成' : '否'));
                lines.push('错误: ' + (diag.errors && diag.errors.length ? diag.errors.join(' | ') : '（无捕获到错误）'));
                if (extra) lines.push(extra);
                return lines.join('\n');
              })
            : Promise.resolve(lines.join('\n'));
        }

        function showCard(title, intro, extraDiag) {
          if (document.querySelector('.admin-fallback')) return;
          return buildDiagText(extraDiag).then(function (report) {
            document.body.insertAdjacentHTML(
              'beforeend',
              '<div class="admin-fallback">' +
                '<h2>' + title + '</h2>' +
                '<p>' + intro + '</p>' +
                '<pre id="admin-diag-text">' + report.replace(/</g, '&lt;') + '</pre>' +
                '<button type="button" id="admin-hard-reload">清除登录信息并重试</button>' +
                '<button type="button" class="gray" id="admin-copy-diag">复制诊断信息</button>' +
                '</div>',
            );
            document.getElementById('admin-hard-reload').addEventListener('click', function () {
              try {
                localStorage.clear();
                sessionStorage.removeItem('admin-sw-reloaded');
              } catch (e) {}
              var done = function () {
                location.reload(true);
              };
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    regs.forEach(function (r) {
                      r.unregister();
                    });
                  })
                  .then(done, done);
              } else {
                done();
              }
            });
            document.getElementById('admin-copy-diag').addEventListener('click', function () {
              var text = document.getElementById('admin-diag-text').textContent;
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
              } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
              }
              this.textContent = '已复制';
            });
            // 界面恢复正常后自动撤掉卡片
            var watchdog = setInterval(function () {
              var text = document.body.innerText || '';
              if (document.querySelector('.app-shell') && text.indexOf('登录中') === -1) {
                var card = document.querySelector('.admin-fallback');
                if (card) card.remove();
                clearInterval(watchdog);
              }
            }, 1000);
          });
        }

        // ---------- 监控 1：界面 8 秒没出来 ----------
        setTimeout(function () {
          if (document.querySelector('.app-shell')) return;
          showCard(
            '后台没能加载出来',
            '点「清除登录信息并重试」试一次；如果反复出现，请点「复制诊断信息」把内容粘贴给阿岩。',
          );
        }, 8000);

        // ---------- 监控 2：「登录中」卡住超过 25 秒 ----------
        var loginStuckSince = null;
        setInterval(function () {
          var text = document.body.innerText || '';
          var loggingIn = text.indexOf('登录中') !== -1 || /logging in/i.test(text);
          if (loggingIn && document.querySelector('.app-shell')) {
            if (!loginStuckSince) {
              loginStuckSince = Date.now();
            } else if (Date.now() - loginStuckSince > 25000) {
              loginStuckSince = null;
              showCard(
                '登录卡住了',
                '多半是浏览器还在用旧的请求通道，或保存的登录信息已失效。点下面的按钮清掉重来，然后重新点「使用 GitHub 登录」。',
                '卡住时长: 超过 25 秒',
              );
            }
          } else {
            loginStuckSince = null;
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
